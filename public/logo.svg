<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Indian Computer Institute logo">
  <defs>
    <linearGradient id="iciGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#iciGrad)"/>
  <!-- mortarboard (graduation cap) -->
  <path d="M32 13 L51 21 L32 29 L13 21 Z" fill="#fbbf24"/>
  <path d="M32 31.5 L20.5 26.6 V33 C20.5 36.3 25.7 38.5 32 38.5 C38.3 38.5 43.5 36.3 43.5 33 V26.6 Z" fill="#f59e0b"/>
  <!-- tassel -->
  <path d="M51 21 V31" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="51" cy="32.5" r="2.2" fill="#fde68a"/>
  <!-- ICI wordmark -->
  <text x="32" y="53" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ICI</text>
</svg>
